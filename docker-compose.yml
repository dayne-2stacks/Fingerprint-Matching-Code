services:
  app:
    build: .
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      - CUDA_VISIBLE_DEVICES=[0,1]
    tty: true
    stdin_open: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
 
    
